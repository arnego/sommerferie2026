<!-- @dsCard group="Components" -->
<title>Buttons & badges — Feriekartet</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--petrol:#1B4F72;--petrol-deep:#123A56;--cream:#FBF5E6;--sand:#F5DEB3;--sunshine:#F4A621;
        --ink:#2C3E50;--success:#27AE60;--muted:#607080;--danger:#C0392B}
  body{margin:0;background:var(--cream);color:var(--ink);font:15px/1.55 Inter,system-ui,sans-serif;padding:40px}
  h1{font:700 30px/1.15 "Playfair Display",Georgia,serif;margin:0 0 24px}
  h2{font:600 13px/1 Inter;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:26px 0 12px}
  .row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
  .btn{font:600 15px/1 Inter;border:0;border-radius:12px;padding:13px 20px;min-height:44px;cursor:pointer;
       display:inline-flex;align-items:center;gap:8px;transition:transform .12s,box-shadow .12s}
  .btn:focus-visible{outline:3px solid var(--sunshine);outline-offset:2px}
  .btn:hover{transform:translateY(-1px)}
  .btn-primary{background:var(--sunshine);color:var(--ink);box-shadow:0 2px 8px rgba(244,166,33,.35)}
  .btn-secondary{background:var(--petrol);color:#fff}
  .btn-secondary:hover{background:var(--petrol-deep)}
  .btn-quiet{background:transparent;color:var(--petrol);box-shadow:inset 0 0 0 1.5px var(--petrol)}
  .btn-danger{background:transparent;color:var(--danger);box-shadow:inset 0 0 0 1.5px var(--danger)}
  .btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
  .badge{font:600 12px/1 Inter;border-radius:999px;padding:6px 11px;display:inline-flex;align-items:center;gap:6px}
  .badge svg{flex:none}
  .b-verified{background:rgba(39,174,96,.14);color:#1d7a46}
  .b-unverified{background:rgba(96,112,128,.14);color:var(--muted)}
  .b-today{background:var(--sunshine);color:var(--ink)}
  .b-premium{background:var(--petrol);color:#fff}
  .b-booked{background:rgba(39,174,96,.14);color:#1d7a46}
  .b-requested{background:rgba(244,166,33,.2);color:#8a5a08}
  .b-none{background:rgba(192,57,43,.12);color:var(--danger)}
</style>
<body>
  <h1>Buttons &amp; badges</h1>
  <h2>Actions</h2>
  <div class="row">
    <button class="btn btn-primary">Start planleggingen</button>
    <button class="btn btn-secondary">Lagre endring</button>
    <button class="btn btn-quiet">Vis på kart</button>
    <button class="btn btn-danger">Slett stopp</button>
    <button class="btn btn-primary" disabled>Sender…</button>
  </div>
  <h2>Trust badges — verification is a visible design element</h2>
  <div class="row">
    <span class="badge b-verified"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M2 6.5 4.5 9 10 3.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>Verifisert · adac.de</span>
    <span class="badge b-unverified">Uverifisert — sjekk selv</span>
  </div>
  <h2>Status badges</h2>
  <div class="row">
    <span class="badge b-today">I dag · dag 14/29</span>
    <span class="badge b-booked">Booket · ref. D9590A9F</span>
    <span class="badge b-requested">Forespurt</span>
    <span class="badge b-none">Ikke booket</span>
    <span class="badge b-premium">Premium</span>
  </div>
</body>
