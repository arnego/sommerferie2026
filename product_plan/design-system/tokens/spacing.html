<title>Spacing & surfaces — Feriekartet</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--petrol:#1B4F72;--cream:#FBF5E6;--sand:#F5DEB3;--ink:#2C3E50;--muted:#607080;--sunshine:#F4A621}
  body{margin:0;background:var(--cream);color:var(--ink);font:15px/1.55 Inter,system-ui,sans-serif;padding:40px}
  h1{font:700 30px/1.15 "Playfair Display",Georgia,serif;margin:0 0 24px}
  h2{font:600 13px/1 Inter;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:28px 0 12px}
  .scale{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
  .step{text-align:center;font:500 12px/1.6 ui-monospace,Menlo,monospace;color:var(--muted)}
  .step i{display:block;background:var(--petrol);border-radius:3px;margin:0 auto 6px}
  .surfaces{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
  .s{border-radius:14px;padding:18px;font-size:13px;color:var(--muted)}
  .s b{display:block;color:var(--ink);font-size:14px;margin-bottom:4px}
  .radii{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end}
  .r{background:#fff;border:2px solid var(--petrol);width:88px;height:56px;display:grid;place-items:center;font:500 12px ui-monospace,monospace;color:var(--muted)}
  .touch{display:inline-grid;place-items:center;min-width:44px;min-height:44px;background:var(--sunshine);border-radius:12px;font-weight:600}
</style>
<body>
  <h1>Spacing &amp; surfaces</h1>
  <h2>4-px scale</h2>
  <div class="scale">
    <div class="step"><i style="width:4px;height:4px"></i>1·4</div>
    <div class="step"><i style="width:8px;height:8px"></i>2·8</div>
    <div class="step"><i style="width:12px;height:12px"></i>3·12</div>
    <div class="step"><i style="width:16px;height:16px"></i>4·16</div>
    <div class="step"><i style="width:24px;height:24px"></i>6·24</div>
    <div class="step"><i style="width:32px;height:32px"></i>8·32</div>
    <div class="step"><i style="width:48px;height:48px"></i>12·48</div>
    <div class="step"><i style="width:64px;height:64px"></i>16·64</div>
  </div>
  <h2>Corner radii</h2>
  <div class="radii">
    <div class="r" style="border-radius:6px">6 chip</div>
    <div class="r" style="border-radius:12px">12 control</div>
    <div class="r" style="border-radius:16px">16 card</div>
    <div class="r" style="border-radius:999px">pill</div>
    <span class="touch">44px</span>
  </div>
  <h2>Surface levels</h2>
  <div class="surfaces">
    <div class="s" style="background:var(--cream);box-shadow:inset 0 0 0 1px #eadfc4"><b>0 · Page</b>cream ground, no shadow</div>
    <div class="s" style="background:var(--sand)"><b>1 · Section</b>sand band groups related cards</div>
    <div class="s" style="background:#fff;box-shadow:0 2px 10px rgba(27,79,114,.08)"><b>2 · Card</b>white, radius 16, soft petrol shadow</div>
    <div class="s" style="background:#fff;box-shadow:0 10px 30px rgba(27,79,114,.16)"><b>3 · Overlay</b>popovers, chat slide-over</div>
  </div>
</body>
